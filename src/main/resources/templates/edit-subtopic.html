<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Edit Subtopic | UPSC Tracker</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      font-family: Arial, sans-serif;

      background: #f5f9ff;

      color: #1f2937;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;
    }

    .container {
      width: 100%;

      max-width: 540px;

      background: #ffffff;

      border: 1px solid #dbeafe;

      border-radius: 18px;

      padding: 30px;

      box-shadow:
              0 10px 35px
              rgba(
                      30,
                      64,
                      175,
                      0.10
              );
    }

    /* =====================================================
       NAVIGATION
    ===================================================== */

    .navigation {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 25px;
    }

    .back-button {
      display: inline-block;

      padding: 9px 14px;

      background: #ffffff;

      border:
              1px solid #cbd5e1;

      border-radius: 8px;

      color: #1e3a8a;

      text-decoration: none;

      font-size: 13px;

      font-weight: bold;

      transition: 0.2s ease;
    }

    .back-button:hover {
      background: #eff6ff;

      border-color: #93c5fd;
    }

    /* =====================================================
       TITLE
    ===================================================== */

    h2 {
      margin: 0 0 10px;

      color: #172554;

      font-size: 28px;
    }

    .subtitle {
      color: #64748b;

      font-size: 14px;

      margin: 0 0 25px;

      line-height: 1.6;
    }

    /* =====================================================
       FORM
    ===================================================== */

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      color: #334155;

      font-size: 14px;

      font-weight: bold;

      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;

      padding: 12px 14px;

      border:
              1px solid #cbd5e1;

      border-radius: 9px;

      background: #ffffff;

      color: #1f2937;

      outline: none;

      font-size: 14px;

      transition: 0.2s ease;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;

      box-shadow:
              0 0 0 3px
              rgba(
                      37,
                      99,
                      235,
                      0.10
              );
    }

    /* =====================================================
       CHECKBOX
    ===================================================== */

    .checkbox-row {
      display: flex;

      align-items: center;

      gap: 9px;

      margin-bottom: 22px;
    }

    .checkbox-row input {
      width: auto;

      accent-color: #2563eb;

      cursor: pointer;
    }

    .checkbox-row label {
      margin: 0;

      cursor: pointer;

      font-weight: 600;
    }

    /* =====================================================
       UPDATE BUTTON
    ===================================================== */

    .update-button {
      width: 100%;

      border: none;

      padding: 13px;

      border-radius: 9px;

      background: #2563eb;

      color: #ffffff;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s ease;
    }

    .update-button:hover {
      background: #1d4ed8;

      transform: translateY(-1px);

      box-shadow:
              0 8px 20px
              rgba(
                      37,
                      99,
                      235,
                      0.18
              );
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 550px) {

      body {
        padding: 18px;
      }

      .container {
        padding: 23px 18px;
      }

      h2 {
        font-size: 24px;
      }

      .navigation {
        flex-direction: column;
      }

      .back-button {
        text-align: center;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =====================================================
       NAVIGATION
  ===================================================== -->

  <div class="navigation">


    <!-- BACK TO TOPIC -->

    <a th:if="${subtopic.topic != null}"
       th:href="@{/topics/{id}(id=${subtopic.topic.id})}"
       class="back-button">

      ← Back to Topic

    </a>


    <!-- FALLBACK -->

    <a th:if="${subtopic.topic == null}"
       th:href="@{/subjects}"
       class="back-button">

      ← Back to Subjects

    </a>


    <!-- DASHBOARD -->

    <a th:href="@{/dashboard}"
       class="back-button">

      ⌂ Back to Dashboard

    </a>


  </div>


  <!-- =====================================================
       TITLE
  ===================================================== -->

  <h2>

    Edit Subtopic

  </h2>


  <p class="subtitle">

    Update the subtopic details below.

  </p>


  <!-- =====================================================
       FORM
  ===================================================== -->

  <form
          th:action="@{/update-subtopic}"
          method="post">


    <!-- SUBTOPIC ID -->

    <input
            type="hidden"
            name="id"
            th:value="${subtopic.id}">


    <!-- =================================================
         TOPIC
    ================================================== -->

    <div class="form-group">

      <label for="topic">

        Topic

      </label>


      <select
              id="topic"
              name="topic.id"
              required>


        <option
                th:each="topic : ${topics}"
                th:value="${topic.id}"
                th:text="${topic.topicName}"
                th:selected="${subtopic.topic != null and subtopic.topic.id == topic.id}">

          Topic Name

        </option>


      </select>

    </div>


    <!-- =================================================
         SUBTOPIC NAME
    ================================================== -->

    <div class="form-group">

      <label for="name">

        Subtopic Name

      </label>


      <input
              type="text"
              id="name"
              name="name"
              th:value="${subtopic.name}"
              placeholder="Enter Subtopic Name"
              required>

    </div>


    <!-- =================================================
         COMPLETED
    ================================================== -->

    <div class="checkbox-row">

      <input
              type="checkbox"
              id="completed"
              name="completed"
              th:checked="${subtopic.completed}">


      <label for="completed">

        Completed

      </label>

    </div>


    <!-- =================================================
         UPDATE
    ================================================== -->

    <button
            type="submit"
            class="update-button">

      Update Subtopic

    </button>


  </form>


</div>


</body>

</html>

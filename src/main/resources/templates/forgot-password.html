
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | UPSC Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;

            color: #ffffff;

            background:
                    radial-gradient(
                            circle at 15% 20%,
                            rgba(168, 85, 247, 0.18),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 85% 75%,
                            rgba(236, 72, 153, 0.14),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 50% 100%,
                            rgba(34, 211, 238, 0.08),
                            transparent 40%
                    ),
                    #080611;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            overflow-x: hidden;
        }

        .container {
            width: 100%;

            max-width: 470px;

            padding: 38px;

            border-radius: 24px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(22, 15, 38, 0.97),
                            rgba(10, 8, 20, 0.99)
                    );

            border: 1px solid
            rgba(168, 85, 247, 0.30);

            box-shadow:
                    0 0 35px
                    rgba(168, 85, 247, 0.13),

                    0 0 70px
                    rgba(236, 72, 153, 0.06),

                    inset 0 0 25px
                    rgba(34, 211, 238, 0.025);

            backdrop-filter: blur(14px);
        }

        .icon {
            width: 70px;

            height: 70px;

            margin: 0 auto 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 19px;

            font-size: 31px;

            background:
                    linear-gradient(
                            135deg,
                            rgba(168, 85, 247, 0.20),
                            rgba(236, 72, 153, 0.16)
                    );

            border: 1px solid
            rgba(168, 85, 247, 0.35);

            box-shadow:
                    0 0 24px
                    rgba(168, 85, 247, 0.16);
        }

        h1 {
            margin: 0 0 10px;

            text-align: center;

            font-size: 29px;

            font-weight: 800;

            background:
                    linear-gradient(
                            90deg,
                            #c084fc,
                            #f472b6,
                            #67e8f9
                    );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .subtitle {
            margin: 0 auto 28px;

            text-align: center;

            font-size: 14px;

            line-height: 1.7;

            color: #9e96ae;
        }

        .message {
            margin-bottom: 20px;

            padding: 11px 14px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }

        .success {
            color: #a7f3d0;

            background:
                    rgba(16, 185, 129, 0.08);

            border: 1px solid
            rgba(16, 185, 129, 0.25);
        }

        .error {
            color: #fda4af;

            background:
                    rgba(244, 63, 94, 0.08);

            border: 1px solid
            rgba(244, 63, 94, 0.25);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #ddd6e8;

            font-size: 13px;

            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 11px;

            border: 1px solid
            rgba(148, 163, 184, 0.22);

            outline: none;

            background:
                    rgba(255, 255, 255, 0.035);

            color: #ffffff;

            font-size: 14px;

            transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease,
                    background 0.2s ease;
        }

        input::placeholder {
            color: #6f687b;
        }

        input:focus {
            background:
                    rgba(255, 255, 255, 0.05);

            border-color:
                    rgba(168, 85, 247, 0.65);

            box-shadow:
                    0 0 0 3px
                    rgba(168, 85, 247, 0.08),

                    0 0 18px
                    rgba(168, 85, 247, 0.08);
        }

        .reset-button {
            width: 100%;

            padding: 13px 16px;

            border: none;

            border-radius: 11px;

            cursor: pointer;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            background:
                    linear-gradient(
                            135deg,
                            #9333ea,
                            #c026d3
                    );

            box-shadow:
                    0 0 22px
                    rgba(168, 85, 247, 0.18);

            transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
        }

        .reset-button:hover {
            transform: translateY(-2px);

            box-shadow:
                    0 0 30px
                    rgba(168, 85, 247, 0.30);
        }

        .links {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 24px;

            flex-wrap: wrap;
        }

        .links a {
            color: #c084fc;

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition: color 0.2s ease;
        }

        .links a:hover {
            color: #67e8f9;
        }

        .separator {
            color: #514b5b;

            font-size: 13px;
        }

        .footer {
            margin-top: 28px;

            text-align: center;

            font-size: 11px;

            color: #696274;

            letter-spacing: 0.4px;
        }

        @media (max-width: 520px) {

            body {
                padding: 18px;
            }

            .container {
                padding: 30px 22px;

                border-radius: 20px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        🔐
    </div>

    <h1>
        Forgot Password?
    </h1>

    <p class="subtitle">
        Enter your registered email address and
        we'll help you reset your password.
    </p>

    <!-- Success message -->
    <div class="message success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <!-- Error message -->
    <div class="message error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form
            th:action="@{/forgot-password}"
            method="post">

        <div class="form-group">

            <label for="email">
                Registered Email
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required>

        </div>

        <button
                type="submit"
                class="reset-button">

            Reset Password

        </button>

    </form>

    <div class="links">

        <a href="/login">
            ← Back to Login
        </a>

        <span class="separator">
            |
        </span>

        <a href="/">
            Home
        </a>

    </div>

    <div class="footer">
        UPSC Tracker • Prepare • Track • Improve
    </div>

</div>

</body>

</html>


<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UPSC Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;

            color: #ffffff;

            background:
                    radial-gradient(
                            circle at 15% 20%,
                            rgba(168, 85, 247, 0.18),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 85% 75%,
                            rgba(236, 72, 153, 0.14),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 50% 100%,
                            rgba(34, 211, 238, 0.08),
                            transparent 40%
                    ),
                    #080611;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            background:
                    linear-gradient(
                            135deg,
                            rgba(255,255,255,0.02),
                            transparent 40%
                    );

            z-index: -1;
        }

        .container {
            width: 100%;

            max-width: 760px;

            padding: 55px 45px;

            text-align: center;

            border-radius: 28px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(22, 15, 38, 0.96),
                            rgba(10, 8, 20, 0.98)
                    );

            border: 1px solid
            rgba(168, 85, 247, 0.28);

            box-shadow:
                    0 0 35px
                    rgba(168, 85, 247, 0.12),

                    0 0 70px
                    rgba(236, 72, 153, 0.06),

                    inset 0 0 25px
                    rgba(34, 211, 238, 0.025);

            backdrop-filter: blur(14px);
        }

        .icon {
            width: 82px;

            height: 82px;

            margin: 0 auto 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 22px;

            font-size: 38px;

            background:
                    linear-gradient(
                            135deg,
                            rgba(168, 85, 247, 0.22),
                            rgba(236, 72, 153, 0.18)
                    );

            border: 1px solid
            rgba(168, 85, 247, 0.38);

            box-shadow:
                    0 0 25px
                    rgba(168, 85, 247, 0.18);
        }

        h1 {
            margin: 0 0 14px;

            font-size: 42px;

            font-weight: 800;

            letter-spacing: -1px;

            background:
                    linear-gradient(
                            90deg,
                            #c084fc,
                            #f472b6,
                            #67e8f9
                    );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .subtitle {
            margin: 0 auto 18px;

            max-width: 600px;

            font-size: 18px;

            line-height: 1.7;

            color: #d8d1e8;
        }

        .description {
            margin: 0 auto 35px;

            max-width: 590px;

            font-size: 14px;

            line-height: 1.8;

            color: #9890aa;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .button {
            min-width: 150px;

            padding: 13px 25px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease,
                    border-color 0.25s ease;
        }

        .login-button {
            color: #ffffff;

            background:
                    linear-gradient(
                            135deg,
                            #9333ea,
                            #c026d3
                    );

            border: 1px solid
            rgba(216, 180, 254, 0.35);

            box-shadow:
                    0 0 22px
                    rgba(168, 85, 247, 0.20);
        }

        .signup-button {
            color: #dffcff;

            background:
                    rgba(34, 211, 238, 0.06);

            border: 1px solid
            rgba(34, 211, 238, 0.32);

            box-shadow:
                    0 0 18px
                    rgba(34, 211, 238, 0.06);
        }

        .button:hover {
            transform: translateY(-2px);
        }

        .login-button:hover {
            box-shadow:
                    0 0 30px
                    rgba(168, 85, 247, 0.34);
        }

        .signup-button:hover {
            border-color:
                    rgba(34, 211, 238, 0.60);

            box-shadow:
                    0 0 25px
                    rgba(34, 211, 238, 0.15);
        }

        .footer {
            margin-top: 38px;

            font-size: 12px;

            color: #716a80;

            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .container {
                padding: 40px 24px;

                border-radius: 22px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 16px;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <div class="icon">
        📚
    </div>

    <h1>
        Welcome to UPSC Tracker
    </h1>

    <p class="subtitle">
        Prepare • Track • Improve
    </p>

    <p class="description">
        Organize your UPSC preparation, track your progress,
        manage subjects and topics, revise effectively,
        and stay consistent throughout your preparation journey.
    </p>

    <div class="buttons">

        <a href="/login"
           class="button login-button">
            Login
        </a>

        <a href="/signup"
           class="button signup-button">
            Create Account
        </a>

    </div>

    <div class="footer">
        Prepare • Track • Improve
    </div>

</div>

</body>

</html>

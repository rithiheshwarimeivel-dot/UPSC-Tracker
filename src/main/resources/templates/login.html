
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | UPSC Tracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                    radial-gradient(
                            circle at 15% 20%,
                            rgba(168, 85, 247, 0.18),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 85% 75%,
                            rgba(236, 72, 153, 0.14),
                            transparent 35%
                    ),
                    radial-gradient(
                            circle at 50% 100%,
                            rgba(34, 211, 238, 0.08),
                            transparent 40%
                    ),
                    #080611;

            color: #ffffff;

            overflow-y: auto;

            padding: 25px 0;
        }

        /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 500px;

            height: 500px;

            background:
                    rgba(
                            168,
                            85,
                            247,
                            0.08
                    );

            border-radius: 50%;

            filter: blur(90px);

            top: -180px;

            right: -150px;

            pointer-events: none;
        }

        body::after {

            content: "";

            position: fixed;

            width: 450px;

            height: 450px;

            background:
                    rgba(
                            236,
                            72,
                            153,
                            0.06
                    );

            border-radius: 50%;

            filter: blur(90px);

            bottom: -200px;

            left: -150px;

            pointer-events: none;
        }

        /* =====================================================
           MAIN WRAPPER
        ===================================================== */

        .login-wrapper {

            width: 100%;

            max-width: 430px;

            padding: 25px;

            position: relative;

            z-index: 2;
        }

        /* =====================================================
           LOGO
        ===================================================== */

        .logo-section {

            text-align: center;

            margin-bottom: 28px;
        }

        .logo-icon {

            width: 64px;

            height: 64px;

            margin: 0 auto 15px;

            border-radius: 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            background:
                    linear-gradient(
                            135deg,
                            rgba(168, 85, 247, 0.28),
                            rgba(236, 72, 153, 0.18)
                    );

            border:
                    1px solid
                    rgba(
                            168,
                            85,
                            247,
                            0.35
                    );

            box-shadow:
                    0 0 30px
                    rgba(
                            168,
                            85,
                            247,
                            0.18
                    ),

                    inset
                    0 1px 0
                    rgba(
                            255,
                            255,
                            255,
                            0.08
                    );
        }

        .logo-section h1 {

            font-size: 28px;

            font-weight: 700;

            letter-spacing: 0.5px;

            background:
                    linear-gradient(
                            90deg,
                            #c084fc,
                            #f472b6,
                            #67e8f9
                    );

            -webkit-background-clip: text;

            background-clip: text;

            -webkit-text-fill-color: transparent;
        }

        .logo-section p {

            margin-top: 7px;

            font-size: 14px;

            color: #9e96ae;

            letter-spacing: 0.3px;
        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            padding: 34px;

            border-radius: 24px;

            background:
                    linear-gradient(
                            145deg,
                            rgba(25, 18, 39, 0.96),
                            rgba(10, 8, 20, 0.98)
                    );

            border:
                    1px solid
                    rgba(
                            168,
                            85,
                            247,
                            0.22
                    );

            backdrop-filter:
                    blur(20px);

            -webkit-backdrop-filter:
                    blur(20px);

            box-shadow:
                    0 30px 80px
                    rgba(
                            0,
                            0,
                            0,
                            0.55
                    ),

                    0 0 35px
                    rgba(
                            168,
                            85,
                            247,
                            0.08
                    );
        }

        .login-card h2 {

            font-size: 23px;

            font-weight: 600;

            margin-bottom: 7px;
        }

        .login-subtitle {

            font-size: 14px;

            color: #9e96ae;

            margin-bottom: 28px;
        }

        /* =====================================================
           ALERTS
        ===================================================== */

        .alert {

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 13px;

            margin-bottom: 20px;

            text-align: center;
        }

        .error-message {

            background:
                    rgba(
                            244,
                            63,
                            94,
                            0.10
                    );

            border:
                    1px solid
                    rgba(
                            244,
                            63,
                            94,
                            0.25
                    );

            color: #fda4af;
        }

        .success-message {

            background:
                    rgba(
                            16,
                            185,
                            129,
                            0.10
                    );

            border:
                    1px solid
                    rgba(
                            16,
                            185,
                            129,
                            0.25
                    );

            color: #86efac;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            font-size: 13px;

            color: #ddd6e8;

            margin-bottom: 8px;

            font-weight: 600;
        }

        .input-wrapper {

            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                    translateY(-50%);

            font-size: 16px;

            opacity: 0.7;

            pointer-events: none;
        }

        .form-group input {

            width: 100%;

            height: 50px;

            padding:
                    0 15px 0 44px;

            border-radius: 12px;

            border:
                    1px solid
                    rgba(
                            255,
                            255,
                            255,
                            0.10
                    );

            outline: none;

            background:
                    rgba(
                            255,
                            255,
                            255,
                            0.035
                    );

            color: #ffffff;

            font-size: 14px;

            transition: 0.25s ease;
        }

        .form-group input::placeholder {

            color: #6f687b;
        }

        .form-group input:focus {

            border-color:
                    rgba(
                            168,
                            85,
                            247,
                            0.65
                    );

            background:
                    rgba(
                            255,
                            255,
                            255,
                            0.055
                    );

            box-shadow:
                    0 0 0 3px
                    rgba(
                            168,
                            85,
                            247,
                            0.08
                    ),

                    0 0 18px
                    rgba(
                            168,
                            85,
                            247,
                            0.08
                    );
        }

        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-wrapper input {

            padding-right: 48px;
        }

        .password-toggle {

            position: absolute;

            right: 14px;

            top: 50%;

            transform:
                    translateY(-50%);

            border: none;

            background: transparent;

            color: #8c829d;

            cursor: pointer;

            font-size: 16px;
        }

        .password-toggle:hover {

            color: #67e8f9;
        }

        /* =====================================================
           REMEMBER + FORGOT
        ===================================================== */

        .form-options {

            display: flex;

            justify-content:
                    space-between;

            align-items: center;

            margin-top: -3px;

            margin-bottom: 24px;

            font-size: 13px;
        }

        .remember {

            display: flex;

            align-items: center;

            gap: 7px;

            color: #9e96ae;
        }

        .remember input {

            width: 14px;

            height: 14px;

            accent-color: #a855f7;
        }

        .forgot-password {

            color: #c084fc;

            text-decoration: none;

            transition: 0.2s ease;
        }

        .forgot-password:hover {

            color: #67e8f9;

            text-decoration: underline;
        }

        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 13px;

            cursor: pointer;

            color: #ffffff;

            font-size: 15px;

            font-weight: 600;

            letter-spacing: 0.2px;

            background:
                    linear-gradient(
                            135deg,
                            #9333ea,
                            #c026d3
                    );

            box-shadow:
                    0 12px 30px
                    rgba(
                            168,
                            85,
                            247,
                            0.22
                    );

            transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease,
                    filter 0.2s ease;
        }

        .login-button:hover {

            transform:
                    translateY(-2px);

            box-shadow:
                    0 16px 35px
                    rgba(
                            168,
                            85,
                            247,
                            0.34
                    );

            filter:
                    brightness(1.08);
        }

        .login-button:active {

            transform:
                    translateY(0);
        }

        /* =====================================================
           SIGNUP
        ===================================================== */

        .signup-section {

            text-align: center;

            margin-top: 26px;

            padding-top: 23px;

            border-top:
                    1px solid
                    rgba(
                            255,
                            255,
                            255,
                            0.07
                    );

            font-size: 13px;

            color: #8f879c;
        }

        .signup-section a {

            color: #c084fc;

            text-decoration: none;

            font-weight: 600;

            margin-left: 4px;
        }

        .signup-section a:hover {

            color: #67e8f9;
        }

        /* =====================================================
           PRIVACY
        ===================================================== */

        .privacy-link {

            text-align: center;

            margin-top: 16px;

            font-size: 12px;

            color: #625b6d;
        }

        .privacy-link a {

            color: #a78bfa;

            text-decoration: none;
        }

        .privacy-link a:hover {

            color: #67e8f9;

            text-decoration: underline;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            text-align: center;

            margin-top: 22px;

            font-size: 11px;

            color: #5e5769;

            letter-spacing: 0.3px;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 480px) {

            .login-wrapper {

                padding: 18px;
            }

            .login-card {

                padding: 27px 22px;

                border-radius: 20px;
            }

            .logo-section h1 {

                font-size: 25px;
            }

        }

    </style>

</head>

<body>

<div class="login-wrapper">

    <!-- LOGO -->

    <div class="logo-section">

        <div class="logo-icon">

            📚

        </div>

        <h1>

            UPSC Tracker

        </h1>

        <p>

            Preparation, With Purpose.

        </p>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <h2>

            Welcome back

        </h2>

        <p class="login-subtitle">

            Continue your UPSC preparation journey.

        </p>


        <!-- ERROR -->

        <div
                th:if="${errorMessage}"
                class="alert error-message"
                th:text="${errorMessage}">

        </div>


        <!-- SUCCESS -->

        <div
                th:if="${successMessage}"
                class="alert success-message"
                th:text="${successMessage}">

        </div>


        <!-- LOGIN FORM -->

        <form
                th:action="@{/login}"
                method="post">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email address

                </label>

                <div class="input-wrapper">

                    <span class="input-icon">

                        ✉

                    </span>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <div
                        class="input-wrapper password-wrapper">

                    <span class="input-icon">

                        🔒

                    </span>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                    <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                            aria-label="Show password">

                        👁

                    </button>

                </div>

            </div>


            <!-- OPTIONS -->

            <div class="form-options">

                <label class="remember">

                    <input
                            type="checkbox"
                            name="remember">

                    <span>

                        Remember me

                    </span>

                </label>


                <a
                        th:href="@{/forgot-password}"
                        href="/forgot-password"
                        class="forgot-password">

                    Forgot password?

                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                    type="submit"
                    class="login-button">

                Login

            </button>

        </form>


        <!-- SIGNUP -->

        <div class="signup-section">

            Don't have an account?

            <a
                    th:href="@{/signup}"
                    href="/signup">

                Create account

            </a>

        </div>


        <!-- PRIVACY -->

        <div class="privacy-link">

            By using UPSC Tracker, you agree to our

            <a
                    th:href="@{/privacy-policy}"
                    href="/privacy-policy">

                Privacy Policy

            </a>

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        UPSC Tracker • Prepare. Track. Improve.

    </div>

</div>


<script>

    function togglePassword() {

        const password =
            document.getElementById("password");

        const button =
            document.querySelector(".password-toggle");

        if (password.type === "password") {

            password.type = "text";

            button.textContent = "🙈";

            button.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            password.type = "password";

            button.textContent = "👁";

            button.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }

</script>

</body>

</html>

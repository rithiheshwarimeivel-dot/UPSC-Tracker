<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>


    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mains Current Affairs Month | UPSC Tracker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background:
                    radial-gradient(
                            circle at 15% 10%,
                            rgba(168, 85, 247, 0.12),
                            transparent 32%
                    ),
                    radial-gradient(
                            circle at 85% 80%,
                            rgba(34, 211, 238, 0.08),
                            transparent 32%
                    ),
                    #080814;

            color: #f4f1ff;

            min-height: 100vh;
        }

        .page {
            margin-left: 250px !important;
            width: calc(100% - 250px) !important;

            min-height: 100vh;

            padding-bottom: 50px;
        }

        .top-bar {
            padding: 24px 45px;

            display: flex;

            align-items: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        .back-button {
            display: inline-flex;

            align-items: center;

            gap: 7px;

            text-decoration: none;

            color: #d8d0e8;

            background:
                    rgba(18, 10, 31, 0.75);

            padding: 10px 18px;

            border-radius: 10px;

            border:
                    1px solid
                    rgba(168, 85, 247, 0.18);

            transition: 0.25s ease;

            font-size: 13px;

            font-weight: 600;

            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            color: #ffffff;

            border-color:
                    rgba(217, 70, 239, 0.55);

            background:
                    linear-gradient(
                            90deg,
                            rgba(168, 85, 247, 0.15),
                            rgba(34, 211, 238, 0.06)
                    );

            transform: translateY(-2px);

            box-shadow:
                    0 0 18px
                    rgba(168, 85, 247, 0.12);
        }

        .dashboard-button {
            border-color:
                    rgba(34, 211, 238, 0.18);
        }

        .dashboard-button:hover {
            border-color:
                    rgba(34, 211, 238, 0.50);

            background:
                    rgba(34, 211, 238, 0.07);

            box-shadow:
                    0 0 18px
                    rgba(34, 211, 238, 0.10);
        }

        .container {
            max-width: 850px;

            margin: 25px auto 0;

            padding: 0 35px;
        }

        .card {
            position: relative;

            overflow: hidden;

            background:
                    linear-gradient(
                            145deg,
                            rgba(25, 12, 43, 0.96),
                            rgba(10, 9, 22, 0.98)
                    );

            border:
                    1px solid
                    rgba(168, 85, 247, 0.24);

            border-radius: 20px;

            padding: 42px 35px;

            text-align: center;

            box-shadow:
                    0 20px 50px
                    rgba(0, 0, 0, 0.40),
                    0 0 35px
                    rgba(168, 85, 247, 0.08);
        }

        .card::before {
            content: "";

            position: absolute;

            top: -100px;
            right: -80px;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            background:
                    radial-gradient(
                            circle,
                            rgba(217, 70, 239, 0.15),
                            transparent 68%
                    );

            pointer-events: none;
        }

        .card::after {
            content: "";

            position: absolute;

            bottom: 0;
            left: 8%;

            width: 84%;
            height: 2px;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            #d946ef,
                            #a855f7,
                            #22d3ee,
                            transparent
                    );

            opacity: 0.75;
        }

        h1 {
            position: relative;

            z-index: 1;

            margin: 0 0 12px;

            font-size: 29px;

            line-height: 1.4;

            font-weight: 800;

            background:
                    linear-gradient(
                            90deg,
                            #ffffff,
                            #e9d5ff,
                            #c4b5fd
                    );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            background-clip: text;
        }

        .year {
            position: relative;

            z-index: 1;

            color: #938aa3;

            margin-bottom: 34px;

            font-size: 14px;
        }

        .year strong {
            color: #22d3ee;
        }

        .status {
            position: relative;

            z-index: 1;

            font-size: 17px;

            margin-bottom: 32px;

            color: #b1a8bd;
        }

        .completed {
            color: #67e8b0;

            font-weight: 700;
        }

        .not-completed {
            color: #fbbf7a;

            font-weight: 700;
        }

        button {
            position: relative;

            z-index: 1;

            border:
                    1px solid
                    rgba(217, 70, 239, 0.35);

            padding: 13px 25px;

            border-radius: 11px;

            cursor: pointer;

            background:
                    linear-gradient(
                            90deg,
                            #a855f7,
                            #d946ef
                    );

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            transition:
                    transform 0.25s ease,
                    box-shadow 0.25s ease,
                    opacity 0.25s ease;

            box-shadow:
                    0 7px 22px
                    rgba(168, 85, 247, 0.20);
        }

        button:hover {
            transform: translateY(-2px);

            opacity: 0.95;

            box-shadow:
                    0 10px 28px
                    rgba(217, 70, 239, 0.25),
                    0 0 18px
                    rgba(168, 85, 247, 0.16);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 800px) {

            .page {
                margin-left: 250px !important;
                width: calc(100% - 250px) !important;
            }

            .top-bar {
                padding: 20px 25px;
            }

            .container {
                padding: 0 25px;
            }

        }

        @media (max-width: 550px) {

            .top-bar {
                padding: 18px 20px;
            }

            .container {
                margin: 10px auto 0;

                padding: 0 20px;
            }

            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .status {
                font-size: 16px;
            }

            .back-button {
                font-size: 12px;

                padding: 9px 13px;
            }

            button {
                width: 100%;

                max-width: 300px;
            }

        }

    </style>
    ```

</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="page">

    ```
    <div class="top-bar">

        <a
                th:href="@{/current-affairs/mains(attemptYear=${attemptYear})}"
                href="/current-affairs/mains"
                class="back-button">

            ← Back to Mains Current Affairs

        </a>

        <a
                th:href="@{/dashboard}"
                href="/dashboard"
                class="back-button dashboard-button">

            ⌂ Back to Dashboard

        </a>

    </div>

    <div class="container">

        <div class="card">

            <h1>

            <span th:text="${section.name}">

                January

            </span>

                – Mains Current Affairs

            </h1>

            <div class="year">

                Year:

                <strong th:text="${attemptYear}">
                    2027
                </strong>

            </div>

            <div class="status">

                Status:

                <span
                        th:if="${completed}"
                        class="completed">

                Completed ✓

            </span>

                <span
                        th:unless="${completed}"
                        class="not-completed">

                Not Completed

            </span>

            </div>

            <form
                    th:action="@{/current-affairs/mains/toggle/{id}(id=${section.id})}"
                    method="post">

                <input
                        type="hidden"
                        name="attemptYear"
                        th:value="${attemptYear}">

                <button type="submit">

                <span th:if="${completed}">

                    Mark as Not Completed

                </span>

                    <span th:unless="${completed}">

                    Mark as Completed

                </span>

                </button>

            </form>

        </div>

    </div>


</div>

</body>

</html>

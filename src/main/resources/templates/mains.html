
<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UPSC Tracker — Mains</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;

            min-height: 100%;

            font-family:
                    "Segoe UI",
                    Arial,
                    sans-serif;
        }

        body {

            background: #070713;

            color: #ffffff;

            overflow-x: hidden;
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .page {

            position: relative;

            min-height: 100vh;

            margin-left:
                    250px !important;

            width:
                    calc(100% - 250px) !important;

            overflow: hidden;

            background:

                    radial-gradient(
                            circle at 50% 20%,
                            rgba(
                                    168,
                                    85,
                                    247,
                                    0.11
                            ),
                            transparent 32%
                    ),

                    radial-gradient(
                            circle at 10% 80%,
                            rgba(
                                    217,
                                    70,
                                    239,
                                    0.07
                            ),
                            transparent 30%
                    ),

                    radial-gradient(
                            circle at 90% 70%,
                            rgba(
                                    34,
                                    211,
                                    238,
                                    0.08
                            ),
                            transparent 28%
                    ),

                    #070713;
        }

        /* =====================================================
           AMBIENT LIGHTS
        ===================================================== */

        .ambient-purple {

            position: absolute;

            width: 520px;

            height: 520px;

            left: -180px;

            top: -170px;

            border-radius: 50%;

            background:
                    rgba(
                            168,
                            85,
                            247,
                            0.09
                    );

            filter: blur(100px);

            animation:
                    ambientPurple
                    10s
                    ease-in-out
                    infinite
                    alternate;
        }

        .ambient-pink {

            position: absolute;

            width: 500px;

            height: 500px;

            right: -180px;

            bottom: -180px;

            border-radius: 50%;

            background:
                    rgba(
                            217,
                            70,
                            239,
                            0.09
                    );

            filter: blur(100px);

            animation:
                    ambientPink
                    11s
                    ease-in-out
                    infinite
                    alternate;
        }

        .ambient-cyan {

            position: absolute;

            width: 320px;

            height: 320px;

            right: 18%;

            top: 8%;

            border-radius: 50%;

            background:
                    rgba(
                            34,
                            211,
                            238,
                            0.055
                    );

            filter: blur(85px);

            animation:
                    cyanPulse
                    7s
                    ease-in-out
                    infinite;
        }

        @keyframes ambientPurple {

            from {

                transform:
                        translate(0, 0)
                        scale(1);
            }

            to {

                transform:
                        translate(90px, 70px)
                        scale(1.15);
            }
        }

        @keyframes ambientPink {

            from {

                transform:
                        translate(0, 0)
                        scale(1);
            }

            to {

                transform:
                        translate(-80px, -70px)
                        scale(1.15);
            }
        }

        @keyframes cyanPulse {

            0%,
            100% {

                opacity: 0.4;

                transform:
                        scale(1);
            }

            50% {

                opacity: 0.8;

                transform:
                        scale(1.18);
            }
        }

        /* =====================================================
           GRID
        ===================================================== */

        .grid {

            position: absolute;

            left: -10%;

            bottom: -25%;

            width: 120%;

            height: 65%;

            opacity: 0.10;

            background-image:

                    linear-gradient(
                            rgba(
                                    168,
                                    85,
                                    247,
                                    0.20
                            ) 1px,
                            transparent 1px
                    ),

                    linear-gradient(
                            90deg,
                            rgba(
                                    34,
                                    211,
                                    238,
                                    0.16
                            ) 1px,
                            transparent 1px
                    );

            background-size:
                    65px 65px;

            transform:
                    perspective(500px)
                    rotateX(62deg);

            transform-origin:
                    center top;

            animation:
                    gridMove
                    14s
                    linear
                    infinite;
        }

        @keyframes gridMove {

            from {

                background-position:
                        0 0;
            }

            to {

                background-position:
                        0 650px;
            }
        }

        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {

            position: absolute;

            inset: 0;

            pointer-events: none;
        }

        .particle {

            position: absolute;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:

                    0 0 8px
                    rgba(
                            255,
                            255,
                            255,
                            0.8
                    ),

                    0 0 16px
                    rgba(
                            34,
                            211,
                            238,
                            0.7
                    );

            opacity: 0;

            animation:
                    floatParticle
                    linear
                    infinite;
        }

        .particle:nth-child(1) {
            left: 8%;
            top: 20%;
            animation-duration: 8s;
        }

        .particle:nth-child(2) {
            left: 18%;
            top: 65%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            left: 30%;
            top: 25%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .particle:nth-child(4) {
            left: 42%;
            top: 78%;
            animation-duration: 9s;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            left: 55%;
            top: 18%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .particle:nth-child(6) {
            left: 67%;
            top: 70%;
            animation-duration: 10s;
            animation-delay: 2s;
        }

        .particle:nth-child(7) {
            left: 76%;
            top: 30%;
            animation-duration: 7s;
        }

        .particle:nth-child(8) {
            left: 88%;
            top: 55%;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        @keyframes floatParticle {

            0% {

                opacity: 0;

                transform:
                        translateY(20px);
            }

            30% {

                opacity: 0.8;
            }

            60% {

                opacity: 1;

                transform:
                        translateY(-30px);
            }

            100% {

                opacity: 0;

                transform:
                        translateY(-70px);
            }
        }

        /* =====================================================
           CONTENT
        ===================================================== */

        .content {

            position: relative;

            z-index: 5;

            width:
                    min(
                            1100px,
                            92%
                    );

            margin:
                    0 auto;

            padding:
                    40px 0 70px;
        }

        /* =====================================================
           TOP NAV
        ===================================================== */

        .topbar {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 15px;

            margin-bottom:
                    40px;
        }

        .back-group {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 10px;

            flex-wrap: wrap;
        }

        .back-button {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                    10px 17px;

            border-radius:
                    11px;

            text-decoration: none;

            color:
                    #aeb9c8;

            background:
                    rgba(
                            255,
                            255,
                            255,
                            0.025
                    );

            border:
                    1px solid
                    rgba(
                            34,
                            211,
                            238,
                            0.15
                    );

            box-shadow:

                    7px 7px 18px
                    rgba(
                            0,
                            0,
                            0,
                            0.45
                    ),

                    -5px -5px 14px
                    rgba(
                            255,
                            255,
                            255,
                            0.015
                    );

            transition:
                    0.3s ease;

            font-size:
                    13px;

            font-weight:
                    600;
        }

        .back-button:hover {

            color:
                    #ffffff;

            border-color:
                    rgba(
                            34,
                            211,
                            238,
                            0.55
                    );

            box-shadow:

                    0 0 18px
                    rgba(
                            34,
                            211,
                            238,
                            0.15
                    ),

                    7px 7px 18px
                    rgba(
                            0,
                            0,
                            0,
                            0.45
                    );

            transform:
                    translateY(-2px);
        }

        .dashboard-button {

            border-color:
                    rgba(
                            168,
                            85,
                            247,
                            0.20
                    );
        }

        .dashboard-button:hover {

            border-color:
                    rgba(
                            168,
                            85,
                            247,
                            0.55
                    );

            box-shadow:

                    0 0 18px
                    rgba(
                            168,
                            85,
                            247,
                            0.16
                    ),

                    7px 7px 18px
                    rgba(
                            0,
                            0,
                            0,
                            0.45
                    );
        }

        /* =====================================================
           HEADER
        ===================================================== */

        .header {

            text-align:
                    center;

            margin-bottom:
                    55px;
        }

        .eyebrow {

            font-size:
                    11px;

            letter-spacing:
                    5px;

            text-transform:
                    uppercase;

            color:
                    #22d3ee;

            margin-bottom:
                    16px;

            text-shadow:
                    0 0 12px
                    rgba(
                            34,
                            211,
                            238,
                            0.25
                    );
        }

        .title {

            font-size:
                    clamp(
                            42px,
                            7vw,
                            72px
                    );

            line-height:
                    1;

            font-weight:
                    800;

            letter-spacing:
                    -2px;

            color:
                    #ffffff;

            text-shadow:

                    0 0 20px
                    rgba(
                            255,
                            255,
                            255,
                            0.08
                    ),

                    0 0 45px
                    rgba(
                            168,
                            85,
                            247,
                            0.15
                    );
        }

        .title span {

            background:

                    linear-gradient(
                            90deg,
                            #d946ef,
                            #a855f7,
                            #22d3ee
                    );

            -webkit-background-clip:
                    text;

            background-clip:
                    text;

            color:
                    transparent;

            filter:
                    drop-shadow(
                            0 0 15px
                            rgba(
                                    34,
                                    211,
                                    238,
                                    0.25
                            )
                    );
        }

        .subtitle {

            max-width:
                    620px;

            margin:
                    20px auto 0;

            color:
                    #777f91;

            font-size:
                    14px;

            line-height:
                    1.7;
        }

        /* =====================================================
           SUBJECT GRID
        ===================================================== */

        .subject-grid {

            display:
                    grid;

            grid-template-columns:
                    repeat(
                            2,
                            minmax(
                                    0,
                                    1fr
                            )
                    );

            gap:
                    22px;
        }

        /* =====================================================
           SUBJECT CARD
        ===================================================== */

        .subject-card {

            position:
                    relative;

            min-height:
                    210px;

            padding:
                    30px;

            border-radius:
                    22px;

            text-decoration:
                    none;

            color:
                    #ffffff;

            background:

                    linear-gradient(
                            145deg,
                            rgba(
                                    25,
                                    27,
                                    43,
                                    0.98
                            ),
                            rgba(
                                    11,
                                    12,
                                    24,
                                    0.98
                            )
                    );

            border:
                    1px solid
                    rgba(
                            168,
                            85,
                            247,
                            0.12
                    );

            box-shadow:

                    12px 12px 30px
                    rgba(
                            0,
                            0,
                            0,
                            0.55
                    ),

                    -8px -8px 22px
                    rgba(
                            255,
                            255,
                            255,
                            0.018
                    );

            overflow:
                    hidden;

            transition:

                    transform 0.35s ease,

                    box-shadow 0.35s ease,

                    border-color 0.35s ease;
        }

        .subject-card::before {

            content:
                    "";

            position:
                    absolute;

            top:
                    0;

            left:
                    0;

            width:
                    100%;

            height:
                    2px;

            background:

                    linear-gradient(
                            90deg,
                            transparent,
                            #d946ef,
                            #a855f7,
                            #22d3ee,
                            transparent
                    );

            opacity:
                    0.65;
        }

        .subject-card::after {

            content:
                    "";

            position:
                    absolute;

            width:
                    180px;

            height:
                    180px;

            right:
                    -80px;

            bottom:
                    -90px;

            border-radius:
                    50%;

            background:
                    rgba(
                            34,
                            211,
                            238,
                            0.06
                    );

            filter:
                    blur(35px);

            transition:
                    0.4s ease;
        }

        .subject-card:hover {

            transform:
                    translateY(-7px);

            border-color:
                    rgba(
                            34,
                            211,
                            238,
                            0.40
                    );

            box-shadow:

                    0 0 30px
                    rgba(
                            168,
                            85,
                            247,
                            0.10
                    ),

                    15px 18px 35px
                    rgba(
                            0,
                            0,
                            0,
                            0.60
                    ),

                    -8px -8px 20px
                    rgba(
                            255,
                            255,
                            255,
                            0.02
                    );
        }

        .subject-card:hover::after {

            transform:
                    scale(1.4);

            background:
                    rgba(
                            34,
                            211,
                            238,
                            0.09
                    );
        }

        /* =====================================================
           ICON
        ===================================================== */

        .icon {

            width:
                    55px;

            height:
                    55px;

            display:
                    flex;

            align-items:
                    center;

            justify-content:
                    center;

            border-radius:
                    16px;

            margin-bottom:
                    22px;

            background:

                    linear-gradient(
                            145deg,
                            rgba(
                                    168,
                                    85,
                                    247,
                                    0.18
                            ),
                            rgba(
                                    34,
                                    211,
                                    238,
                                    0.08
                            )
                    );

            border:
                    1px solid
                    rgba(
                            34,
                            211,
                            238,
                            0.20
                    );

            box-shadow:

                    inset 4px 4px 10px
                    rgba(
                            0,
                            0,
                            0,
                            0.40
                    ),

                    inset -4px -4px 10px
                    rgba(
                            255,
                            255,
                            255,
                            0.02
                    ),

                    0 0 18px
                    rgba(
                            34,
                            211,
                            238,
                            0.06
                    );

            color:
                    #22d3ee;

            font-size:
                    23px;

            text-shadow:
                    0 0 12px
                    rgba(
                            34,
                            211,
                            238,
                            0.75
                    );
        }

        /* =====================================================
           TEXT
        ===================================================== */

        .subject-name {

            font-size:
                    22px;

            font-weight:
                    700;

            letter-spacing:
                    0.2px;

            color:
                    #f7f9ff;

            margin-bottom:
                    9px;
        }

        .subject-description {

            color:
                    #727b8d;

            font-size:
                    13px;

            line-height:
                    1.6;

            max-width:
                    430px;
        }

        .open-label {

            display:
                    inline-flex;

            align-items:
                    center;

            gap:
                    8px;

            margin-top:
                    22px;

            color:
                    #22d3ee;

            font-size:
                    12px;

            font-weight:
                    700;

            letter-spacing:
                    0.5px;

            text-shadow:
                    0 0 10px
                    rgba(
                            34,
                            211,
                            238,
                            0.35
                    );
        }

        .arrow {

            transition:
                    0.3s ease;
        }

        .subject-card:hover .arrow {

            transform:
                    translateX(5px);
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            text-align:
                    center;

            margin-top:
                    55px;

            color:
                    #4e5567;

            font-size:
                    10px;

            letter-spacing:
                    3px;

            text-transform:
                    uppercase;
        }

        .footer-dot {

            display:
                    inline-block;

            width:
                    4px;

            height:
                    4px;

            margin:
                    0 9px;

            border-radius:
                    50%;

            background:
                    #22d3ee;

            box-shadow:
                    0 0 10px
                    #22d3ee;
        }

        /* =====================================================
           IMPORTANT:
           SIDEBAR ALWAYS 250px
        ===================================================== */

        @media (max-width: 800px) {

            .page {

                margin-left:
                        250px !important;

                width:
                        calc(100% - 250px) !important;
            }

            .content {

                width:
                        92%;

                padding-top:
                        35px;
            }

            .subject-grid {

                grid-template-columns:
                        1fr;
            }

            .subject-card {

                min-height:
                        190px;
            }

        }

        @media (max-width: 450px) {

            .content {

                width:
                        90%;
            }

            .back-group {

                flex-direction:
                        column;

                align-items:
                        flex-end;
            }

            .back-button {

                padding:
                        8px 12px;

                font-size:
                        11px;
            }

            .header {

                margin-bottom:
                        38px;
            }

            .title {

                font-size:
                        40px;
            }

            .subtitle {

                font-size:
                        13px;
            }

            .subject-card {

                padding:
                        24px;

                min-height:
                        175px;
            }

            .subject-name {

                font-size:
                        19px;
            }
        }

        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                        0.01ms !important;

                animation-iteration-count:
                        1 !important;

                scroll-behavior:
                        auto !important;
            }
        }

    </style>

</head>

<body>


<!-- =====================================================
     COMMON SIDEBAR
===================================================== -->

<div th:replace="~{fragments/sidebar :: sidebar}"></div>


<div class="page">


    <!-- =================================================
         BACKGROUND
    ================================================= -->

    <div class="ambient-purple"></div>

    <div class="ambient-pink"></div>

    <div class="ambient-cyan"></div>

    <div class="grid"></div>


    <!-- =================================================
         PARTICLES
    ================================================= -->

    <div class="particles">

        <span class="particle"></span>

        <span class="particle"></span>

        <span class="particle"></span>

        <span class="particle"></span>

        <span class="particle"></span>

        <span class="particle"></span>

        <span class="particle"></span>

        <span class="particle"></span>

    </div>


    <!-- =================================================
         MAIN CONTENT
    ================================================= -->

    <main class="content">


        <!-- =================================================
             TOP NAVIGATION
        ================================================= -->

        <div class="topbar">

            <div class="back-group">

                <a
                        th:href="@{/subjects}"
                        href="/subjects"
                        class="back-button">

                    ← Back to Subjects

                </a>


                <a
                        th:href="@{/dashboard}"
                        href="/dashboard"
                        class="back-button dashboard-button">

                    ⌂ Back to Dashboard

                </a>

            </div>

        </div>


        <!-- =================================================
             HEADER
        ================================================= -->

        <header class="header">

            <div class="eyebrow">

                UPSC CIVIL SERVICES

            </div>


            <h1 class="title">

                UPSC <span>MAINS</span>

            </h1>


            <p class="subtitle">

                Build analytical depth, structure your answers,
                and systematically cover the complete Mains syllabus.

            </p>

        </header>


        <!-- =================================================
             MAINS SUBJECTS
        ================================================= -->

        <section class="subject-grid">


            <a
                    th:each="subject : ${mainsSubjects}"

                    th:href="@{/sections/{id}(id=${subject.id})}"

                    class="subject-card">


                <div class="icon">

                    ✦

                </div>


                <div
                        class="subject-name"
                        th:text="${subject.name}">

                    General Studies

                </div>


                <div class="subject-description">

                    Explore sections, topics and subtopics
                    for this Mains subject.

                </div>


                <div class="open-label">

                    EXPLORE SUBJECT

                    <span class="arrow">

                        →

                    </span>

                </div>


            </a>


        </section>


        <!-- =================================================
             FOOTER
        ================================================= -->

        <div class="footer">

            Learn

            <span class="footer-dot"></span>

            Analyze

            <span class="footer-dot"></span>

            Master

        </div>


    </main>


</div>


</body>

</html>

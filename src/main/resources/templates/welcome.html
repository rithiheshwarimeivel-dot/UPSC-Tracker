<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>UPSC Tracker — Begin Your Journey</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #070713;
            color: #ffffff;
        }

        /* =========================
           MAIN CINEMATIC BACKGROUND
           ========================= */

        .welcome-page {
            position: relative;

            width: 100%;
            height: 100vh;
            min-height: 600px;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                    radial-gradient(
                            circle at 50% 45%,
                            rgba(108, 60, 190, 0.18),
                            transparent 32%
                    ),
                    radial-gradient(
                            circle at 15% 20%,
                            rgba(0, 220, 255, 0.08),
                            transparent 28%
                    ),
                    radial-gradient(
                            circle at 85% 75%,
                            rgba(255, 25, 150, 0.09),
                            transparent 30%
                    ),
                    #070713;
        }

        /* =========================
           AMBIENT GLOW
           ========================= */

        .ambient-purple {
            position: absolute;

            width: 520px;
            height: 520px;

            left: -180px;
            top: -170px;

            border-radius: 50%;

            background: rgba(130, 50, 255, 0.12);

            filter: blur(90px);

            animation:
                    ambientMove 9s ease-in-out infinite alternate;
        }

        .ambient-pink {
            position: absolute;

            width: 500px;
            height: 500px;

            right: -190px;
            bottom: -180px;

            border-radius: 50%;

            background: rgba(255, 25, 160, 0.11);

            filter: blur(100px);

            animation:
                    ambientMovePink 10s ease-in-out infinite alternate;
        }

        .ambient-cyan {
            position: absolute;

            width: 350px;
            height: 350px;

            right: 15%;
            top: 5%;

            border-radius: 50%;

            background: rgba(0, 220, 255, 0.06);

            filter: blur(90px);

            animation:
                    cyanPulse 7s ease-in-out infinite;
        }

        @keyframes ambientMove {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(100px, 80px) scale(1.15);
            }

        }

        @keyframes ambientMovePink {

            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-90px, -80px) scale(1.15);
            }

        }

        @keyframes cyanPulse {

            0%,
            100% {
                opacity: 0.45;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.2);
            }

        }

        /* =========================
           FUTURISTIC GRID
           ========================= */

        .grid {
            position: absolute;

            left: -10%;
            bottom: -35%;

            width: 120%;
            height: 70%;

            opacity: 0.13;

            background-image:
                    linear-gradient(
                            rgba(150, 110, 255, 0.25) 1px,
                            transparent 1px
                    ),
                    linear-gradient(
                            90deg,
                            rgba(150, 110, 255, 0.25) 1px,
                            transparent 1px
                    );

            background-size: 70px 70px;

            transform:
                    perspective(500px)
                    rotateX(62deg);

            transform-origin: center top;

            animation:
                    gridMove 12s linear infinite;
        }

        @keyframes gridMove {

            from {
                background-position: 0 0;
            }

            to {
                background-position: 0 700px;
            }

        }

        /* =========================
           PARTICLES
           ========================= */

        .particles {
            position: absolute;
            inset: 0;

            pointer-events: none;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                    0 0 8px rgba(255, 255, 255, 0.8),
                    0 0 16px rgba(180, 90, 255, 0.6);

            animation:
                    floatParticle linear infinite;

            opacity: 0;
        }

        .particle:nth-child(1) {
            left: 8%;
            top: 20%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .particle:nth-child(2) {
            left: 17%;
            top: 70%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            left: 27%;
            top: 30%;
            animation-duration: 8s;
            animation-delay: 0.5s;
        }

        .particle:nth-child(4) {
            left: 39%;
            top: 82%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .particle:nth-child(5) {
            left: 52%;
            top: 17%;
            animation-duration: 8s;
            animation-delay: 1.5s;
        }

        .particle:nth-child(6) {
            left: 65%;
            top: 73%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .particle:nth-child(7) {
            left: 74%;
            top: 25%;
            animation-duration: 7s;
            animation-delay: 0.2s;
        }

        .particle:nth-child(8) {
            left: 83%;
            top: 55%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .particle:nth-child(9) {
            left: 91%;
            top: 18%;
            animation-duration: 8s;
            animation-delay: 2s;
        }

        .particle:nth-child(10) {
            left: 48%;
            top: 60%;
            animation-duration: 7s;
            animation-delay: 3s;
        }

        @keyframes floatParticle {

            0% {
                opacity: 0;
                transform:
                        translateY(20px)
                        scale(0.5);
            }

            20% {
                opacity: 0.8;
            }

            50% {
                opacity: 1;
                transform:
                        translateY(-25px)
                        scale(1);
            }

            80% {
                opacity: 0.6;
            }

            100% {
                opacity: 0;
                transform:
                        translateY(-70px)
                        scale(0.4);
            }

        }

        /* =========================
           CENTRAL HALO
           ========================= */

        .halo {
            position: absolute;

            width: 570px;
            height: 570px;

            border-radius: 50%;

            border:
                    1px solid rgba(170, 100, 255, 0.12);

            box-shadow:
                    0 0 80px rgba(140, 70, 255, 0.08),
                    inset 0 0 80px rgba(140, 70, 255, 0.04);

            animation:
                    haloPulse 6s ease-in-out infinite;
        }

        .halo::before {
            content: "";

            position: absolute;

            inset: 35px;

            border-radius: 50%;

            border:
                    1px solid rgba(0, 220, 255, 0.08);
        }

        .halo::after {
            content: "";

            position: absolute;

            inset: 80px;

            border-radius: 50%;

            border:
                    1px solid rgba(255, 30, 160, 0.08);
        }

        @keyframes haloPulse {

            0%,
            100% {
                transform: scale(0.96);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.03);
                opacity: 1;
            }

        }

        /* =========================
           MAIN CONTENT
           ========================= */

        .hero {
            position: relative;

            z-index: 10;

            width: min(900px, 90%);

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eyebrow {
            font-size: 12px;

            letter-spacing: 5px;

            text-transform: uppercase;

            color: rgba(210, 200, 255, 0.7);

            margin-bottom: 22px;

            animation:
                    revealEyebrow 1s ease forwards;

            opacity: 0;
        }

        @keyframes revealEyebrow {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           LOGO
           ========================= */

        .brand {
            line-height: 0.9;

            font-size: clamp(
                    72px,
                    12vw,
                    155px
            );

            font-weight: 800;

            letter-spacing: -7px;

            animation:
                    logoReveal
                    1.5s
                    cubic-bezier(.16,1,.3,1)
                    forwards;

            opacity: 0;

            transform: scale(0.82);
        }

        .upsc {
            display: block;

            color: #ffffff;

            text-shadow:
                    0 0 18px rgba(255, 255, 255, 0.12),
                    0 0 45px rgba(130, 80, 255, 0.18);
        }

        .tracker {
            display: block;

            margin-top: 5px;

            background:
                    linear-gradient(
                            90deg,
                            #8f55ff 0%,
                            #d33cff 32%,
                            #ff35a9 58%,
                            #26dfff 100%
                    );

            background-size: 250% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                    gradientMove 4s linear infinite,
                    neonGlow 3s ease-in-out infinite alternate;
        }

        @keyframes logoReveal {

            0% {
                opacity: 0;

                transform: scale(0.82);

                filter: blur(14px);
            }

            70% {
                opacity: 1;

                filter: blur(0);
            }

            100% {
                opacity: 1;

                transform: scale(1);

                filter: blur(0);
            }

        }

        @keyframes gradientMove {

            0% {
                background-position: 0% center;
            }

            100% {
                background-position: 250% center;
            }

        }

        @keyframes neonGlow {

            from {
                filter:
                        drop-shadow(
                                0 0 10px
                                rgba(150, 70, 255, 0.35)
                        );
            }

            to {
                filter:
                        drop-shadow(
                                0 0 28px
                                rgba(255, 40, 180, 0.55)
                        );
            }

        }

        /* =========================
           TAGLINE
           ========================= */

        .tagline {
            margin-top: 34px;

            font-size:
                    clamp(20px, 3vw, 31px);

            font-weight: 500;

            letter-spacing: 1px;

            color: #f3f1ff;

            animation:
                    taglineReveal 1s ease 1.1s forwards;

            opacity: 0;
        }

        .tagline span {
            color: #b7b0d9;

            font-weight: 400;
        }

        @keyframes taglineReveal {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .description {
            max-width: 610px;

            margin-top: 15px;

            color: #85829d;

            font-size: 15px;

            line-height: 1.7;

            animation:
                    descriptionReveal
                    1s ease 1.5s forwards;

            opacity: 0;
        }

        @keyframes descriptionReveal {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* =========================
           ACTION BUTTONS
           ========================= */

        .actions {
            display: flex;

            align-items: center;

            gap: 14px;

            margin-top: 38px;

            animation:
                    actionsReveal
                    1s ease 2s forwards;

            opacity: 0;
        }

        @keyframes actionsReveal {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .btn {
            position: relative;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 205px;

            padding: 15px 25px;

            border-radius: 13px;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 0.5px;

            transition: 0.3s ease;

            overflow: hidden;
        }

        .btn-primary {
            color: #ffffff;

            background:
                    linear-gradient(
                            110deg,
                            #7648e8,
                            #c832e8,
                            #ef349e
                    );

            box-shadow:
                    0 0 20px rgba(167, 55, 235, 0.25),
                    0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .btn-primary::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 60%;
            height: 100%;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(255,255,255,0.25),
                            transparent
                    );

            transform: skewX(-20deg);

            transition: 0.6s;
        }

        .btn-primary:hover::before {
            left: 130%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);

            box-shadow:
                    0 0 30px rgba(210, 45, 235, 0.42),
                    0 14px 40px rgba(0, 0, 0, 0.4);
        }

        .btn-secondary {
            color: #d9d5ed;

            border:
                    1px solid rgba(150, 130, 210, 0.25);

            background:
                    rgba(255, 255, 255, 0.035);

            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            color: #ffffff;

            border-color:
                    rgba(0, 220, 255, 0.45);

            background:
                    rgba(0, 220, 255, 0.06);

            box-shadow:
                    0 0 25px rgba(0, 220, 255, 0.12);

            transform: translateY(-3px);
        }

        /* =========================
           BOTTOM BRAND LINE
           ========================= */

        .bottom-line {
            position: absolute;

            z-index: 10;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;

            align-items: center;

            gap: 12px;

            color: #57536e;

            font-size: 11px;

            letter-spacing: 2px;

            text-transform: uppercase;

            white-space: nowrap;

            animation:
                    bottomReveal
                    1s ease 2.7s forwards;

            opacity: 0;
        }

        .bottom-line .dot {
            width: 4px;
            height: 4px;

            border-radius: 50%;

            background: #c63fff;

            box-shadow:
                    0 0 10px #c63fff;
        }

        @keyframes bottomReveal {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }

        /* =========================
           SIDE LIGHT STREAKS
           ========================= */

        .streak {
            position: absolute;

            width: 260px;
            height: 1px;

            opacity: 0;

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(120, 75, 255, 0.6),
                            transparent
                    );

            filter: blur(0.5px);
        }

        .streak-one {
            left: -100px;
            top: 30%;

            transform: rotate(-12deg);

            animation:
                    streakMove 7s ease-in-out infinite;
        }

        .streak-two {
            right: -100px;
            top: 62%;

            transform: rotate(15deg);

            background:
                    linear-gradient(
                            90deg,
                            transparent,
                            rgba(0, 220, 255, 0.55),
                            transparent
                    );

            animation:
                    streakMoveTwo 8s ease-in-out infinite;
        }

        @keyframes streakMove {

            0%,
            100% {
                opacity: 0;

                transform:
                        translateX(-80px)
                        rotate(-12deg);
            }

            45% {
                opacity: 0.8;
            }

            70% {
                opacity: 0;

                transform:
                        translateX(180px)
                        rotate(-12deg);
            }

        }

        @keyframes streakMoveTwo {

            0%,
            100% {
                opacity: 0;

                transform:
                        translateX(80px)
                        rotate(15deg);
            }

            45% {
                opacity: 0.7;
            }

            70% {
                opacity: 0;

                transform:
                        translateX(-180px)
                        rotate(15deg);
            }

        }

        /* =========================
           RESPONSIVE
           ========================= */

        @media (max-width: 700px) {

            .welcome-page {
                min-height: 550px;
            }

            .halo {
                width: 390px;
                height: 390px;
            }

            .brand {
                font-size:
                        clamp(62px, 18vw, 100px);

                letter-spacing: -4px;
            }

            .eyebrow {
                font-size: 9px;
                letter-spacing: 3px;
            }

            .tagline {
                font-size: 20px;
            }

            .description {
                font-size: 13px;
                padding: 0 15px;
            }

            .actions {
                flex-direction: column;

                width: 100%;

                gap: 10px;

                margin-top: 30px;
            }

            .btn {
                width: min(290px, 90%);
            }

            .grid {
                background-size: 45px 45px;
            }

            .bottom-line {
                font-size: 8px;
                letter-spacing: 1px;
            }

        }

        @media (max-width: 430px) {

            .brand {
                font-size: 65px;
            }

            .halo {
                width: 310px;
                height: 310px;
            }

            .tagline {
                margin-top: 25px;
                font-size: 18px;
            }

            .description {
                margin-top: 12px;
            }

        }

        /* =========================
           REDUCED MOTION
           ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }

        }

    </style>

</head>

<body>

<div class="welcome-page">

    <div class="ambient-purple"></div>

    <div class="ambient-pink"></div>

    <div class="ambient-cyan"></div>

    <div class="grid"></div>

    <div class="halo"></div>

    <div class="streak streak-one"></div>

    <div class="streak streak-two"></div>

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <main class="hero">

        <div class="eyebrow">
            YOUR UPSC JOURNEY
        </div>


        <div class="brand">

            <span class="upsc">
                UPSC
            </span>

            <span class="tracker">
                TRACKER
            </span>

        </div>


        <div class="tagline">

            Plan.
            <span>Prepare.</span>
            Progress.

        </div>


        <p class="description">

            Turn your UPSC preparation into measurable progress —
            track what you study, see where you stand, and keep moving forward.

        </p>


        <div class="actions">

            <a th:href="@{/signup}"
               href="/signup"
               class="btn btn-primary"
               aria-label="Create your UPSC Tracker journey">

                BEGIN YOUR JOURNEY&nbsp; →

            </a>


            <a th:href="@{/login}"
               href="/login"
               class="btn btn-secondary"
               aria-label="Login to UPSC Tracker">

                I'M ALREADY ON MY JOURNEY

            </a>

        </div>

    </main>


    <div class="bottom-line">

        <span>Preparation</span>

        <span class="dot"></span>

        <span>Tracking</span>

        <span class="dot"></span>

        <span>Progress</span>

    </div>


</div>

</body>

</html>
